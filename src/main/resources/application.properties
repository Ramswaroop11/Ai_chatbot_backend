spring.application.name=Ai-chatbot
server.port=${PORT:8080}
# ==================================================
# GEMINI CHAT
# ==================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash

# ==================================================
# MYSQL
# ==================================================

spring.datasource.url=jdbc:mysql://mysql-4d1cd43-cloud-mysql.e.aivencloud.com:23301/ai_chatbot?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${AIVEN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================
# JPA
# ==================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# GEMINI EMBEDDINGS
# ==================================================
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# ==================================================
# PINECONE
# ==================================================
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=ai-rag-documents
spring.ai.vectorstore.pinecone.namespace=default